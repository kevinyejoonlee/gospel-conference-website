# Twice-weekly ping so Supabase sees activity (Free tier idle pause).
#
# Optional: set repo Variable KEEPALIVE_URL to override the default origin.

name: Supabase keepalive

on:
  schedule:
    # Monday & Thursday 14:00 UTC
    - cron: '0 14 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      KEEPALIVE_URL: ${{ vars.KEEPALIVE_URL }}
    steps:
      - name: Ping keepalive
        run: |
          URL="${KEEPALIVE_URL:-https://gospelconference.ca/api/keepalive}"
          code="$(curl -sS -o /dev/null -w '%{http_code}' "$URL")"
          echo "HTTP $code → $URL"
          test "$code" = "204"
